const SESSION='__LOCAL_SESSION_TOKEN__';

let appTabId=sessionStorage.getItem(TAB_STORAGE_KEY);

function sendTabLifecycle(path,keepalive=false){
 return fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Local-Session':SESSION},
   body:JSON.stringify({tabId:appTabId}),keepalive,cache:'no-store'}).catch(()=>{});
}
void sendTabLifecycle('heartbeat');
setInterval(()=>void sendTabLifecycle('heartbeat'),7000);
window.addEventListener('pageshow',()=>void sendTabLifecycle('heartbeat'));
window.addEventListener('pagehide',()=>void sendTabLifecycle('app/tab-close',true));
function durationLabel(seconds){if(seconds==null||!Number.isFinite(seconds)||seconds<0)return 'Calculating…';seconds=Math.floor(seconds);const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),sec=seconds%60;return h?`${h}h ${m}m`:m?`${m}m ${sec}s`:`${sec}s`}

const state={step:1,archive:'',tracks:[],artists:[],lidarr:'http://127.0.0.1:8686',key:'',busy:false,error:'',connectionStage:'',verificationStage:'progress',pipeline:null,found:false,hasData:false,verify:null,verifyPolling:false,catalog:null,catalogPolling:false,recovery:null,recoveryPolling:false,inventory:null,inventoryPolling:false,releaseGroups:[],releaseGroupsLoaded:false,inventoryItems:[],inventoryItemsLoaded:false,inventoryListCategory:"",inventoryListType:"song",stagingQueue:[],stagingLoaded:false,stagingSelected:new Set(),stagingFilter:"",reviewQueue:null,reviewFilter:"",reviewMode:"all"};
const el=document.getElementById('app');
// A browser-refresh checkpoint, scoped to the current local .NET server session.
// Store navigation and unsaved candidate choices only: NEVER save API keys,

const NAVIGATION_KEY='ytm-lidarr-navigation-v1:'+SESSION;
let navigationReady=false;
function readNavigation(){
 try{
  const item=JSON.parse(sessionStorage.getItem(NAVIGATION_KEY)||'null');
  if(!item||item.schema!==1)return null;

 }catch{return null}
}

 if(!navigationReady)return;
 try{

   schema:1,step:state.step,
   flow:window.Flow918?.active?window.Flow918.captureNavigation():null

}

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,kind='',disabled=false)=>`<button class="cta ${kind}" ${disabled||state.busy?'disabled':''} onclick="${action}">${label}</button>`;
const back=(n)=>`<div class="back"><button onclick="changeStep(${n})">← Back</button></div>`;

function changeStep(n){state.step=n;state.error='';state.connectionStage='';render()}
function alertError(e){state.busy=false;state.connectionStage='';state.error=e?.message||String(e);render()}
function table(rows){return `<div class="scrolltable"><table><thead><tr><th>#</th><th>Artist</th><th>Song</th><th>YouTube Link</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.Artist)}</td><td>${esc(r.Song)}</td><td>${/^https:\/\/www\.youtube\.com\/watch\?v=[A-Za-z0-9_-]{11}$/.test(r.YouTubeUrl||'')?`<a href="${esc(r.YouTubeUrl)}" target="_blank" rel="noopener noreferrer">View ↗</a>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}
function unifiedProgressPage(){
 const p=state.pipeline||{};
 const total=p.songsTotal||state.tracks.length||1,checked=p.songsChecked||0;
 const artists=p.totalArtists||new Set(state.tracks.map(x=>(x.Artist||'').toLowerCase())).size||1;
 const matched=p.artistsMatched||0;
 const overall=Number(p.progressPercent||0);
 const portion=(x,t)=>Math.round(100*x/Math.max(1,t));

 let remaining='Calculating…';
 // An estimate is only available during the initial scan. Other stages have
 // variable request counts; don't display a misleading ETA.
 if(p.done)remaining='Finished';
 else if(p.failed)remaining='Unavailable';

   const est=(total-checked)*secs/checked;
   remaining=durationLabel(est)+' + follow-up checks';
 }
 const rate=checked>0&&secs>0?(checked*60/secs).toFixed(1)+' songs/min':'Calculating…';
 return `<section class="view"><h1>Verifying Your Music Library</h1>
 <div class="verification">
 <strong>Overall Progress</strong><div class="progress-track"><div class="progress-fill" style="width:${overall}%"></div></div>
 <div class="row"><span>${p.done?'Complete':'Verifying and matching your music'}</span><span>${overall.toFixed(0)}%</span></div>
 <strong>Recordings Checked</strong><div class="progress-track"><div class="progress-fill" style="width:${portion(checked,total)}%"></div></div>
 <div class="row"><span>${checked} of ${total} checked</span><span>${portion(checked,total)}%</span></div>
 <strong>Unique Artists Resolved</strong><div class="progress-track"><div class="progress-fill" style="width:${portion(matched,artists)}%"></div></div>
 <div class="row"><span>${matched} of ${artists} identified</span><span>${portion(matched,artists)}%</span></div>
 </div><div class="eta-block"><div><span>Elapsed time</span><strong>${durationLabel(secs)}</strong></div>
 <div><span>Time remaining</span><strong>${remaining}</strong></div>
 <div><span>Verification speed</span><strong>${rate}</strong></div></div>
 ${p.failed?`<p class="message">${esc(p.error||'Verification could not finish. No Lidarr changes were made.')}</p>${btn('Retry Verification','restartUnifiedPipeline()')}`:''}

}
let unifiedPolling=false;

 try{await api('pipeline/start');state.pipeline={running:true};render();if(!unifiedPolling){unifiedPolling=true;pollUnifiedPipeline()}}
 catch(e){alertError(e)}
}

 try{state.inventory=await api('lidarr/inventory/status');await window.Flow918.open('manual')}
 catch(e){alertError(e)}
}

 try{
  const p=await api('pipeline/status');state.pipeline=p;

if(s===2)c=`<section class="view compact"><h1>Prepare Your YouTube Music Export</h1><p class="lead">You're about to be directed to Google Takeout to download a copy of your<br>YouTube Music library.</p><p class="lead">On Google's website, click <strong>Next step</strong>, then change the <strong>File size to 50 GB.</strong></p><p class="lead muted">Don't worry! Your music library metadata is likely much smaller than 50 GB. Song<br>titles, artists, and links generally take up just a few megabytes. Uploaded media<br>may make an export larger.</p><p class="lead">Google may take several minutes to several days to prepare your export.</p><p class="lead">You'll receive an email confirming your request and another when your export is<br>ready to download.</p><p class="fine">You can download an already prepared export again while it remains available.</p>${btn('Continue to Google Takeout ↗','openTakeout()')}${back(1)}</section>`;
if(s===3)c=`<section class="view"><div class="symbol">⌕</div><h1>Find Your Downloaded Music Data</h1><p class="lead muted">Once your Google Takeout export is ready, download the ZIP file and scan your<br>Downloads folder.</p>${btn(state.busy?'Scanning...':'⌕ Scan for Takeout File','scan()',state.busy?'outline':'',state.busy)}${state.archive?`<p class="address">Archive: ${esc(state.archive)}</p>`:''}${state.busy?'<p class="info">Analyzing archive...</p>':''}${back(1)}</section>`;
if(s===4){const credits=new Set(state.tracks.map(t=>String(t.Artist||'').trim().toLowerCase()).filter(Boolean)).size;c=`<section class="view compact"><div class="symbol ok">✓</div><h1>Your Music Library Is Ready!</h1><div class="library-section"><h2>YouTube Music Data</h2><div class="counts"><div class="count"><strong>${credits}</strong><span>Artists</span></div><div class="count"><strong>${state.tracks.length}</strong><span>Songs</span></div></div><p class="fine">Counts are from the selected archive. Artist figures are unverified unique credit strings.</p><div class="tabletitle">Music Preview</div>${table(state.tracks.slice(0,100))}${btn('Continue to Lidarr Setup','changeStep(5)')}${back(3)}</div></section>`}
if(s===5){if(state.connectionStage){const done=state.connectionStage==='connected';c=`<section class="view"><div class="symbol">▤</div><h1>Connect to Lidarr</h1><div class="splash"><div class="bigcheck">${done?'✓':'◌'}</div><h2>${done?'Connected to Lidarr!':'Connecting to Lidarr...'}</h2><p class="text-status">${done?'API key validated and Lidarr artist catalog loaded.':'Verifying API key and loading the artist catalog...'}</p></div></section>`}else{c=`<section class="view"><div class="symbol">▤</div><h1>Connect to Lidarr</h1><p class="lead muted" style="margin-bottom:23px">Lidarr ${state.found?'found!':'connection setup'}</p><p class="connection-copy">To find your API key, open Lidarr and use the left sidebar:<strong>Settings → General → API Key</strong></p>${btn('Get API Key ↗','openLidarr()','outline')}<input class="field" id="key" type="password" placeholder="Paste your API key" value="${esc(state.key)}" autocomplete="off" spellcheck="false" oninput="state.key=this.value"/><details class="narrow fine" style="margin:10px auto"><summary>Use a different Lidarr address</summary><input class="field" id="lidarr-url" value="${esc(state.lidarr)}" oninput="state.lidarr=this.value" aria-label="Lidarr address"/></details><p class="fine narrow" style="font-size:14px">Connecting starts fresh verification automatically. Song and artist titles are sent to MusicBrainz, Apple/iTunes and Deezer for matching; your Takeout ZIP and Lidarr API key are not sent to those services.</p>${btn('Connect to Lidarr','connect()')}${back(4)}</section>`}}
if(s===6)c=unifiedProgressPage();

el.innerHTML=`<div class="progress-track"><div class="progress-fill" style="width:${[10,20,35,40,50,56][s-1]||10}%"></div></div><div class="build-version" aria-label="Application version">YouTube Music to Lidarr · ${BUILD_VERSION}</div><div class="step">STEP ${s} OF 10</div><div class="divider"></div>${c}${state.error?`<p class="message" role="alert">${esc(state.error)}</p>`:''}`;

rememberNavigation();
}
function catalogPanel(){
 const c=state.catalog||{};
 const status=c.running||c.done||c.failed;
 const stats=status?`<div class="catalog-stats"><div><strong>${c.checkedCount||0} / ${c.total||0}</strong><span>External checks completed</span></div><div><strong>${c.appleSupported||0}</strong><span>Apple title + artist matches</span></div><div><strong>${c.deezerSupported||0}</strong><span>Deezer title + artist matches</span></div><div><strong>${c.bothSupported||0}</strong><span>Both catalogs agree</span></div><div><strong>${c.newMusicBrainzIdentities||0}</strong><span>New provisional MusicBrainz matches</span></div></div>`:'';
 const desc=c.done?'Finished. Export the updated CSVs below. Only targeted MusicBrainz re-queries may add provisional IDs; exact-recording confidence is unchanged.':(c.phase||'Ready when you are.');
 return `<div class="catalog-panel"><h2>Optional: Research the remaining matches</h2><p>Search Apple/iTunes and Deezer for the ${Math.max(0,(state.verify?.ambiguous||0)+(state.verify?.unmatched||0))} ambiguous or unmatched songs ONLY. This can take several minutes depending on API limits.</p><p><strong>Privacy:</strong> clicking Start shares the artist and song title with Apple and Deezer. The Takeout ZIP, YouTube links and Lidarr API key are NOT sent.</p>${stats}<p aria-live="polite">${esc(desc)}</p>${!status?btn('Start Independent Catalog Research','startCatalogResearch()','outline'):''}${c.done?'<p>Outside catalog hits alone do not prove MusicBrainz IDs. Only separate successful MusicBrainz re-queries can recover provisional IDs; exact masters still require evidence.</p>':''}</div>`
}

function reviewPanel(){
 const q=state.reviewQueue;
 const stats=q?`<p class="fine">${q.items.length} source items in this review view · ${q.savedDecisions} saved decisions · ${q.savedAlbumCount} saved album choices in this Lidarr comparison.</p>`:'';
 return `<section class="review-note" aria-label="Guided manual review"><h2>Guided manual review — planning only</h2>
 <p class="fine">Review artist IDs and recording candidates, save decisions for future versions, and compare conflicting editions. <strong>Saving a candidate never verifies a MusicBrainz identity, changes the existing manual-review count automatically, or authorizes a Lidarr search.</strong></p>
 <p class="fine">Decisions are saved locally under Documents/MusicTakeoutToolkit/review-decisions-v1.json. After a new comparison, album decisions must be explicitly re-applied and revalidated.</p>
 ${stats}${btn('Open Streamlined Manual Review','Flow918.open()','outline')}${btn(q?'Refresh Guided Review Queue':'Load Guided Review Queue','loadReviewQueue()','outline')}
 ${q?`<div class="review-filter-row"><input id="review-filter" type="search" value="${esc(state.reviewFilter)}" placeholder="Filter artist, song or album…" oninput="filterReviewItems(this.value)" />
 <select id="review-mode" onchange="state.reviewMode=this.value;updateReviewCards()"><option value="all" ${state.reviewMode==='all'?'selected':''}>All unresolved</option><option value="artist" ${state.reviewMode==='artist'?'selected':''}>Artists only</option><option value="song" ${state.reviewMode==='song'?'selected':''}>Songs only</option><option value="reviewed" ${state.reviewMode==='reviewed'?'selected':''}>Previously reviewed</option><option value="stale" ${state.reviewMode==='stale'?'selected':''}>Stale candidate selections</option></select></div>
 <p class="fine" id="review-count"></p><div class="review-scroll" id="review-items"></div>
 ${btn('Export Saved Review Decisions — NO WRITES (CSV)','exportReviewDecisions()','outline')}`:''}
 </section>`;
}
function reviewMatchIndexes(){
 const items=state.reviewQueue?.items||[],term=state.reviewFilter.toLowerCase().trim(),mode=state.reviewMode;
 return items.map((x,i)=>({x,i})).filter(({x})=>(!term||(x.artist+' '+x.song+' '+x.album+' '+x.reason).toLowerCase().includes(term)) &&
 (mode==='all'||(mode==='reviewed'?x.disposition!=='unreviewed':mode==='stale'?x.evidenceStatus!=='current':x.kind===mode))).map(x=>x.i);
}
function reviewCards(){
 const items=state.reviewQueue?.items||[],indices=reviewMatchIndexes();
 return {count:indices.length,html:indices.slice(0,30).map(i=>{
 const x=items[i];const choices=(x.candidates||[]).map(c=>`<option value="${esc(c.id)}" ${x.selected===c.id?'selected':''}>${esc(c.label)} — ${esc(c.id.slice(0,8))} · ${esc(c.evidence.slice(0,78))}</option>`).join('');
 return `<article class="review-entry"><h4>${esc(x.kind==='artist'?'Artist identity':`Song row ${x.row}`)}: ${esc(x.artist)}${x.song?' — '+esc(x.song):''}</h4>
 ${x.album?`<div class="fine">Source album: ${esc(x.album)}</div>`:''}
 <p class="fine">${esc(x.reason||'Needs independent evidence')} · ${x.candidates.length} candidate ID(s) · Saved: ${esc(x.disposition)}</p>
 ${x.evidenceStatus!=='current'?`<p class="review-stale">Saved candidate is absent from current evidence. Re-select a current candidate or clear this decision.</p>`:''}
 <div class="review-fields"><select id="review-disposition-${i}" aria-label="Review decision"><option value="needs-research" ${x.disposition==='needs-research'?'selected':''}>Needs additional research</option><option value="defer" ${x.disposition==='defer'?'selected':''}>Defer for later</option><option value="candidate-for-planning" ${x.disposition==='candidate-for-planning'?'selected':''} ${!x.candidates.length?'disabled':''}>Candidate selected for planning only</option><option value="clear">Clear saved decision</option></select>
 <select id="review-candidate-${i}" aria-label="Candidate ID"><option value="">Select candidate ID (not verified)</option>${choices}</select>
 <textarea id="review-note-${i}" maxlength="400" placeholder="Optional evidence notes (400 characters maximum)">${esc(x.note||'')}</textarea></div>
 <button onclick="saveReviewItem(${i})">Save review decision</button></article>`;
 }).join('')||'<p class="fine">No review items match this filter.</p>'};
}
function filterReviewItems(v){state.reviewFilter=v;updateReviewCards()}
function updateReviewCards(){const target=document.getElementById('review-items');if(!target)return;
 const view=reviewCards();target.innerHTML=view.html;const count=document.getElementById('review-count');if(count)count.textContent=`${view.count} matches; showing first ${Math.min(30,view.count)}. Filter by artist or title to find others.`;}
async function loadReviewQueue(){try{state.reviewQueue=await api('review/queue');render();updateReviewCards()}catch(e){state.error=e.message;render()}}
async function saveReviewItem(i){try{const x=state.reviewQueue?.items[i];if(!x)throw Error('Review item no longer available.');
 const disposition=document.getElementById('review-disposition-'+i)?.value||'',candidateId=document.getElementById('review-candidate-'+i)?.value||'',note=document.getElementById('review-note-'+i)?.value||'';
 await api('review/decision',{key:x.key,disposition,candidateId,note});await loadReviewQueue();
 }catch(e){state.error=e.message;render()}}
async function exportReviewDecisions(){try{const r=await fetch('/api/review/decisions.csv',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','X-Local-Session':SESSION},body:'{}'});
 if(!r.ok)throw Error((await r.json()).error||'Export failed');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='music-review-decisions-NO-WRITES.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
 }catch(e){state.error=e.message;render()}}

function lidarrInventoryPanel(){

 const stats=x.done?`<div class="migration-summary" aria-label="Migration categories">
  <div class="migration-summary-group"><h3>YouTube Music</h3><div class="catalog-stats">${metric(x.sourceArtists,'Artists in Takeout','all','artist')}${metric(x.totalSongs,'Songs in Takeout','all','song')}</div></div>
  <div class="migration-summary-group"><h3>Lidarr — Already in Library</h3><div class="catalog-stats">${metric(x.artistAlready,'Artists registered in Lidarr','already','artist')}${metric(x.already,'Songs with downloaded file records','already','song')}</div></div>
  <div class="migration-summary-group"><h3>To Be Added <small>(proposals only)</small></h3><div class="catalog-stats">${metric(x.artistToAdd,'Artists needing a metadata entry','toAdd','artist')}${metric(x.toAdd,'Songs without a confirmed file','toAdd','song')}</div></div>
  <div class="migration-summary-group"><h3>Manual Review</h3><div class="catalog-stats">${metric(x.artistReview,'Artists needing identity review','review','artist')}${metric(x.review,'Songs needing identity or recording review','review','song')}</div></div>
  <div class="migration-summary-group"><h3>Release selection and approvals</h3><div class="catalog-stats">${metric(x.albumDisambiguated,'Duplicated recordings resolved by source album')}${metric(x.releaseChoicesPending,'Album/release choices pending')}${metric(x.searchReady,'Album-search proposals; approval pending')}${metric(x.manualConflicts,'Recording ID disagreements (also shown in proposed additions)')}${metric(x.albumOnlySearchTargets,'Album-only search targets; exact track unverified')}${metric(x.albumAliasesPending,'Album title aliases pending review')}${metric(x.albumReviewGroups,'Album review groups')}${metric(x.groupApprovals,'Group choices approved for planning')}</div><p class="fine">A song may be counted under “To Be Added” while its album choice is still held. No download or Lidarr change occurs here.</p></div>
  <div class="migration-summary-group"><h3>Read-only inventory totals</h3><div class="catalog-stats">${metric(x.tracksRead,'Lidarr track metadata records')}${metric(x.filesRead,'Lidarr downloaded-file records')}</div></div>
 </div>`:'';
 return `<div class="catalog-panel"><h2>Compare Against Your Lidarr Library</h2><p>Recognize songs already registered in Lidarr, group duplicate releases safely, and prepare additions without downloading anything. Artist metadata and downloaded audio are counted separately.</p>${stats}${inventoryDetailPanel()}${started?`<p class="fine">Artists checked: ${x.artistsChecked||0} / ${x.artistsTotal||'—'} · Requests completed: ${x.requestsFinished||0} · Automatic retries: ${x.retries||0}</p>`:''}<p aria-live="polite">${esc(x.phase||(started?'Comparison status pending':'Ready to compare — no media-file presence has been inferred yet.'))}</p>${x.failed?`<p class="message">${esc(x.error||'Inventory comparison failed.')}</p>`:''}${!x.running?btn(x.done?'Refresh Lidarr Library Comparison':'Compare Lidarr Track & File Inventory','compareLidarrInventory()','outline'):''}${started?btn('Export Lidarr Inventory Diagnostics (CSV)','exportLidarrDiagnostics()','outline'):''}${x.done?`${btn('Export All Lidarr Release Candidates (CSV)','exportLidarrCandidates()','outline')}${albumReviewPanel()}${stagingPanel()}${btn('Export Manual Review Triage (CSV)',"exportPlanningCsv('manual-review','lidarr-manual-review-triage.csv')",'outline')}<p class="fine">The release-candidates export includes every competing track, album title, recording MBID, evidence and why selection is held. The Migration Readiness export includes an action-eligibility field. This version does not automatically search or add music to Lidarr.</p>`:''}</div>`;
}

function showInventoryList(category,type){
 state.inventoryListCategory=category;
 state.inventoryListType=type;
 render();
 const input=document.getElementById('inventory-list-filter');
 if(input)input.focus();
}
function inventoryDetailPanel(){
 if(!state.inventory?.done||!state.inventoryListCategory)return '';
 const category=state.inventoryListCategory;
 const label={all:'All YouTube Music items',already:'Already in Lidarr',toAdd:'To Be Added',review:'Manual Review'}[category]||category;
 return `<section class="inventory-detail-panel"><h3>${esc(label)} — ${state.inventoryListType==='song'?'Songs':'Artists'}</h3>
 <p class="fine">Search by artist, song, album or decision reason. These are read-only inventory results, not download approvals.</p>
 <input id="inventory-list-filter" type="search" placeholder="Search this list…" oninput="filterInventoryRows(this.value)" />
 <p id="inventory-list-count" class="fine"></p><div id="inventory-list-results" class="inventory-results">${inventoryRowsMarkup('')}</div>
 <button class="album-approve-btn" onclick="state.inventoryListCategory='';render()">Close list</button></section>`;
}
function inventoryRowsMarkup(query){
 const kind=state.inventoryListType, category=state.inventoryListCategory;
 const v=String(query||'').toLowerCase();
 const matches=(state.inventoryItems||[]).filter(x=>x.type===kind &&
   (category==='all'||category==='already'&&x.category.startsWith('Already in Library')||
    category==='toAdd'&&x.category.startsWith('To Be Added')||
    category==='review'&&x.category.startsWith('Manual Review')) &&
   (x.artist+' '+x.title+' '+x.album+' '+x.reason).toLowerCase().includes(v));
 const items=matches.slice(0,100).map(x=>`<div class="inventory-item"><strong>${esc(x.artist)}${x.title?' — '+esc(x.title):''}</strong>
 <span>${esc(x.album)}${x.album&&x.selectedAlbum?' → ':''}${esc(x.selectedAlbum)}</span><small>${esc(x.reason)}</small></div>`).join('');
 return `<p class="fine">${matches.length} matching ${kind==='song'?'songs':'artists'}${matches.length>100?' (first 100 shown)':''}</p>${items||'<p class="fine">No matches.</p>'}`;
}
function filterInventoryRows(query){
 const place=document.getElementById('inventory-list-results');
 if(place)place.innerHTML=inventoryRowsMarkup(query);
}
async function fetchInventoryItems(){
 const data=await api('lidarr/inventory/items');state.inventoryItems=data.items||[];
 state.inventoryItemsLoaded=true;
}
// All queue decisions are SESSION-ONLY. They do not authorize any Lidarr writes.
async function fetchStagingQueue(){
 const data=await api('lidarr/inventory/staging-queue');
 state.stagingQueue=data.items||[];state.stagingLoaded=true;
 state.stagingSelected=new Set([...state.stagingSelected].filter(id=>state.stagingQueue.some(x=>x.albumId===id)));
}
function stagingVisibleItems(){
 const term=(state.stagingFilter||'').toLowerCase().trim();
 return (state.stagingQueue||[]).filter(x=>(x.artist+' '+x.album+' '+x.albumId).toLowerCase().includes(term));
}
function stagingRowsMarkup(){
 const matches=stagingVisibleItems();
 const rows=matches.slice(0,65).map(x=>`<label class="staging-item ${x.otherUnverifiedSongs?'flagged':''}">
  <input type="checkbox" data-staging-id="${x.albumId}" ${state.stagingSelected.has(x.albumId)?'checked':''} onchange="toggleStagingSelection(${x.albumId},this.checked)" />
  <span><strong>${esc(x.artist)} — ${esc(x.album)}</strong><small>${x.safeSongs} track-backed source ${x.safeSongs===1?'song':'songs'} · Lidarr album ${x.albumId}${x.staged?' · STAGED IN THIS SESSION':''}${x.otherUnverifiedSongs?' · '+x.otherUnverifiedSongs+' additional unverified source rows associated with this album':''}</small></span>
 </label>`).join('');
 return `<p class="fine">${matches.length} albums match${matches.length>65?' (first 65 shown)':''} · ${state.stagingSelected.size} selected</p>${rows||'<p class="fine">No matching albums.</p>'}`;
}
function stagingPanel(){
 if(!state.inventory?.done)return '';
 if(!state.stagingLoaded)return '<p class="fine">Loading local staging proposals…</p>';
 const items=state.stagingQueue||[];
 const staged=items.filter(x=>x.staged).length;
 const covered=items.reduce((v,x)=>v+x.safeSongs,0);
 return `<section class="staging-panel" aria-label="Local album staging queue">
 <h3>Prepare album searches — no writes</h3>
 ${btn('Open New Migration Preview','Flow918.openPreview()','outline')}
 <p class="fine">${items.length} eligible Lidarr albums covering ${covered} source songs with track-backed evidence. <strong>${staged} albums staged locally.</strong> This is NOT final search or download approval.</p>
 <p class="fine"><strong>Important:</strong> A future Lidarr album search may download ALL tracks on a selected album, not only the songs in your Takeout. Version-disputed and album-only proposals are not automatically staged.</p>
 <input class="staging-input" aria-label="Search stageable albums" type="search" placeholder="Find an artist or Lidarr album..." value="${esc(state.stagingFilter)}" oninput="filterStagingQueue(this.value)" />
 <div class="staging-list" id="staging-list">${stagingRowsMarkup()}</div>
 <div class="staging-actions"><button class="secondary" onclick="selectVisibleStaging()">Select visible albums</button><button onclick="applyStaging(true)">Stage selected</button><button class="secondary" onclick="applyStaging(false)">Unstage selected</button></div>
 ${btn('Export Staging Queue — NO WRITES (CSV)',"exportPlanningCsv('staging-queue','lidarr-album-staging-queue-NO-WRITES.csv')",'outline')}
 </section>`;
}
function toggleStagingSelection(id,checked){if(checked)state.stagingSelected.add(id);else state.stagingSelected.delete(id)}
function filterStagingQueue(value){state.stagingFilter=value;const el=document.getElementById('staging-list');if(el)el.innerHTML=stagingRowsMarkup()}
function selectVisibleStaging(){for(const x of stagingVisibleItems().slice(0,65))state.stagingSelected.add(x.albumId);const el=document.getElementById('staging-list');if(el)el.innerHTML=stagingRowsMarkup()}
async function applyStaging(stage){
 try{
  const ids=[...state.stagingSelected];
  if(!ids.length)throw Error('Choose one or more albums first.');
  if(ids.length>100)throw Error('Select 100 or fewer albums at once.');
  await api('lidarr/inventory/stage-albums',{albumIds:ids,stage});
  state.stagingSelected=new Set();await fetchStagingQueue();render();
 }catch(e){state.error=e.message;render()}
}
function albumReviewPanel(){
 const groups=state.releaseGroups||[];
 if(!state.inventory?.done)return '';
 if(!state.releaseGroupsLoaded)return '<p class="fine">Loading album-level release choices…</p>';
 const awaiting=groups.filter(g=>!g.approvedAlbumId);
 const complete=groups.filter(g=>g.approvedAlbumId);
 const cards=groups.map(g=>{
   const choices=(g.choices||[]).map(c=>`<option value="${c.albumId}" ${c.albumId===g.suggestedAlbumId?'selected':''} ${!c.complete?'disabled':''}>${esc(c.title)} — ${c.supportedRows}/${g.songs} songs${['edition-or-suffix-variant','volume-notation-variant','unicode-glyph-variant','ep-suffix-variant'].includes(c.relationship)?' (title or edition differs)':''}${!c.complete?' (incomplete)':''}</option>`).join('');
   const validChoices=g.choices?.some(c=>c.complete);
   const id=esc(g.id);
   return `<div class="album-choice-card" data-search="${esc((g.artist+' '+g.sourceAlbum+' '+g.recommendation).toLowerCase())}">
     <h4>${esc(g.artist)} — ${esc(g.sourceAlbum)}</h4>
     <p class="fine"><strong>${g.songs} songs</strong> · ${esc(g.explanation)}</p>
     ${g.savedAlbumId?`<p class="fine">Saved in review notebook: <strong>${esc(g.choices.find(c=>String(c.albumId)===g.savedAlbumId)?.title||'Previous album '+g.savedAlbumId)}</strong>. Always revalidate before reuse.</p>${!g.approvedAlbumId&&g.choices.some(c=>String(c.albumId)===g.savedAlbumId&&c.complete)?`<button class="album-approve-btn" onclick="reapplySavedAlbum('${id}')">Reapply saved choice for planning only</button>`:''}<button class="album-approve-btn" onclick="forgetSavedAlbum('${id}')">Forget saved album choice</button>`:''}
     ${g.approvedAlbumId?`<p class="fine"><strong>Chosen for planning:</strong> ${esc(g.choices.find(x=>x.albumId===g.approvedAlbumId)?.title||'Album '+g.approvedAlbumId)}. No Lidarr changes.</p>`:
       `<label for="album-choice-${id}">Select target album</label><select id="album-choice-${id}" aria-label="Album for ${esc(g.artist)} ${esc(g.sourceAlbum)}" ${!validChoices?'disabled':''}>${choices}</select><button class="album-approve-btn" onclick="approveAlbumChoice('${id}')" ${!validChoices?'disabled':''}>Approve release for planning only</button>`}
     <details><summary>Review ${g.choices.length} candidate albums and evidence</summary><ul>${g.choices.map(c=>`<li>${esc(c.title)} — ${c.supportedRows}/${g.songs} album-search candidates; ${esc(c.relationship)}${c.complete?'':' — NOT group-approvable'}</li>`).join('')}</ul></details>
   </div>`;
 }).join('');
 return `<section class="album-review-panel" aria-label="Album group review"><h3>Review albums together, not song by song</h3>
 <p class="fine">${awaiting.length} album groups awaiting a release choice · ${complete.length} approved for planning. Choices use recording-ID evidence OR validated artist/title and explicit album-edition relationships. A suggested album is not proof of an exact recording master; edition differences require deliberate approval.</p>
 <p class="fine"><strong>No downloads, searches or Lidarr write operations happen when selecting a release.</strong> Final search approval is a separate future step.</p>
 <label for="album-group-filter">Find an artist or album</label><input id="album-group-filter" type="search" placeholder="Search groups…" oninput="filterAlbumGroups(this.value)" />

// Restore ALL screens from a per-tab navigation checkpoint. The server remains
// authoritative about source data, pipeline state and completed Lidarr staging.
// A refresh must never start a new scan, repeat a connection, or replay an import.
async function restoreNavigationOnLoad(){
 const checkpoint=readNavigation();
 let connectedToServer=false;
 try{
  const [p,s,priorImport]=await Promise.all([api('pipeline/status'),api('state'),api('lidarr/import/status')]);
  state.archive=s.archive||'';
  state.tracks=s.tracks||[];
  state.found=!!s.lidarrConnected;
  state.hasData=state.tracks.length>0;
  state.lidarr=s.lidarrUrl||state.lidarr;
  state.pipeline=p;
  connectedToServer=true;
  if(priorImport?.checkpointUnreadable){
    state.error='A previous Lidarr import checkpoint cannot be read. New Lidarr writes are blocked to prevent duplicate searches. Preserve the checkpoint in Documents\\MusicTakeoutToolkit for diagnosis.';
    render();return;
  }
  // A new EXE session loses its live Takeout comparison, but its import audit
  // survives. Surface that first: never silently repeat a partially sent batch.
  if(priorImport?.restored&&priorImport.total>0&&!p.running&&!p.done&&!checkpoint?.flow){
    state.step=6;
    navigationReady=true;
    window.Flow918?.openRecoveredImport(priorImport);
    return;
  }
  const running=!!p.running,finished=!!p.done,failed=!!p.failed;
  const hasPipeline=running||finished||failed;
  let step=Number(checkpoint?.step);
  if(!Number.isInteger(step)||step<1||step>6)step=1;
  if(running)step=6; // Always rejoin active work, never start a second scan.
  else if((finished||failed)&&(!checkpoint||step===6||checkpoint.flow))step=6;
  else if(step>=4&&!state.hasData)step=3;
  state.step=step;
  state.error='';
  if(s.analyzing&&!hasPipeline){
   // Resume waiting for the EXISTING Takeout parser, not scanning again.
   state.step=3;
   navigationReady=true;
   render();
   poll();
   return;
  }
  if(finished&&step===6&&checkpoint?.flow&&window.Flow918){
   state.inventory=await api('lidarr/inventory/status');
   try{await window.Flow918.restoreNavigation(checkpoint.flow)}
   catch(error){
    state.error='The saved screen could not be restored: '+(error?.message||error);
    await window.Flow918.open('manual');
   }
  }else if(finished&&step===6){
   state.inventory=await api('lidarr/inventory/status');
   await openUnifiedReview();
  }else{
   render();
   if(running&&!unifiedPolling){unifiedPolling=true;pollUnifiedPipeline()}
  }
 }catch(e){
  // Do not overwrite a previously saved page when the local server is temporarily
  // unavailable. A later refresh can still rejoin it.
  state.error='Unable to reconnect to the running application: '+(e?.message||e);
  render();
 }finally{
  // A transient network error must not replace the last good checkpoint.
  navigationReady=connectedToServer;
  if(connectedToServer)rememberNavigation();
 }
}
render();
window.addEventListener('load',restoreNavigationOnLoad,{once:true});
