name: Build and smoke-test Windows .NET

on:
  workflow_dispatch:
  push:
    paths:
      - 'YouTube-Music-Takeout-To-Lidarr/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'YouTube-Music-Takeout-To-Lidarr/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: YouTube-Music-Takeout-To-Lidarr
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile project
        run: dotnet build YouTubeMusicToLidarr.csproj -c Release -r win-x64
      - name: Run built-in self-tests
        run: dotnet run --project YouTubeMusicToLidarr.csproj -c Release -r win-x64 --no-build -- --self-test
      - name: Run offline UI regressions
        run: |
          node --check AppUI/flow918.js
          node tools/offline_v09113_manual_auto.js
          node tools/offline_v09112_review_prefetch.js
          node tools/offline_v09115_preflight_restore.js
          node tools/offline_v091152_migration_reconciliation.js
          node tools/offline_v091153_song_fallback.js
          node tools/offline_v091154_song_titles_history.js
          node tools/offline_v091155_review_progress_provenance.js
          node tools/offline_v091156_lidarr_import.js
          node tools/offline_v091158_checkpoint_safety.js
          node tools/offline_v0918_ui_smoke.js
          node tools/offline_v0921_navigation_resume.js
      - name: Publish Windows application
        run: dotnet publish YouTubeMusicToLidarr.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Verify download contents
        shell: pwsh
        run: |
          @(
            'publish/YouTubeMusicToLidarr.exe',
            'publish/AppUI/index.html',
            'publish/AppUI/flow918.js',
            'publish/AppUI/flow918.css',
            'publish/AppUI/Gost1o1-logo.jpg'
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_)) { throw "Missing release file: $_" }
          }
          Get-FileHash publish/YouTubeMusicToLidarr.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeMusicToLidarr-win-x64-test-build
          path: YouTube-Music-Takeout-To-Lidarr/publish/**
