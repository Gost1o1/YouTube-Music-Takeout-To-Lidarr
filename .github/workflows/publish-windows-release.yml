name: Publish Windows download

# Intentionally manual: a source push never publishes a public download.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v0.9.1.15.5'
        required: true
        type: string
      prerelease:
        description: 'Mark as a preview release (recommended until import is implemented)'
        required: true
        type: boolean
        default: true

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run self-tests
        run: |
          dotnet build YouTubeMusicToLidarr.csproj -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          dotnet run --project YouTubeMusicToLidarr.csproj -c Release -r win-x64 --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Self-tests failed' }
        shell: pwsh
      - name: Run UI regression tests
        shell: pwsh
        run: |
          node --check AppUI/flow918.js
          if ($LASTEXITCODE -ne 0) { throw 'UI syntax test failed' }
          @(
            'tools/offline_v09113_manual_auto.js',
            'tools/offline_v09112_review_prefetch.js',
            'tools/offline_v09115_preflight_restore.js',
            'tools/offline_v091152_migration_reconciliation.js',
            'tools/offline_v091153_song_fallback.js',
            'tools/offline_v091154_song_titles_history.js',
            'tools/offline_v091155_review_progress_provenance.js',
            'tools/offline_v0918_ui_smoke.js',
            'tools/offline_v0921_navigation_resume.js'
          ) | ForEach-Object {
            node $_
            if ($LASTEXITCODE -ne 0) { throw "UI regression failed: $_" }
          }
      - name: Publish and zip complete Windows application
        shell: pwsh
        run: |
          dotnet publish YouTubeMusicToLidarr.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          @(
            'publish/YouTubeMusicToLidarr.exe',
            'publish/AppUI/index.html',
            'publish/AppUI/flow918.js',
            'publish/AppUI/flow918.css',
            'publish/AppUI/Gost1o1-logo.jpg'
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_)) { throw "Missing release file: $_" }
          }
          Compress-Archive -Path 'publish/*' -DestinationPath 'YouTubeMusicToLidarr-win-x64.zip' -Force
          Get-FileHash 'YouTubeMusicToLidarr-win-x64.zip' -Algorithm SHA256 | Format-List
      - name: Create GitHub Release with Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+(\.\d+){2,5}$') {
            throw 'Invalid release tag. Use a version like v0.9.1.15.5.'
          }
          $releaseArgs = @(
            'release', 'create', $env:RELEASE_TAG,
            'YouTubeMusicToLidarr-win-x64.zip',
            '--target', $env:GITHUB_SHA,
            '--title', "YouTube Music to Lidarr $env:RELEASE_TAG",
            '--notes-file', 'docs/RELEASE-NOTES.md'
          )
          if ($env:PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
