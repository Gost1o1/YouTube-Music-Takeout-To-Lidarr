<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Music Takeout to Lidarr</title>
<style>
:root{font-family:Arial,'Segoe UI',sans-serif;color:#0b0b0b;background:#fafafa}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-size:17px}body{padding:27px 28px}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}#app{width:100%;max-width:1200px;margin:auto;border:1px solid #e3e3e3;border-radius:40px;background:#fbfbfb;padding:32px 36px 44px;min-height:460px}.progress-track{height:12px;border-radius:50px;background:#ededed;overflow:hidden}.progress-fill{height:100%;background:#347fdf;transition:width .25s}.step{font-size:17px;text-align:right;color:#777;margin:13px 0 26px}.divider{border-top:1px solid #e6e6e6}.view{text-align:center;padding:40px 0 6px}.view.compact{padding-top:26px}.symbol{font-size:31px;color:#777;margin:12px 0 26px}.symbol.ok{color:#0a9d4d;font-size:37px}h1{font-size:39px;line-height:1.2;margin:22px 0 24px;font-weight:750}h2{font-size:26px;margin:22px 0 17px}p{line-height:1.55}.lead{font-size:25px;line-height:1.55;margin:22px auto 27px;max-width:1030px}.muted{color:#747474}.fine{font-size:17px;color:#747474}.narrow{max-width:840px;margin-left:auto;margin-right:auto}.cta{width:min(100%,800px);border:0;border-radius:50px;background:#090909;color:white;font-weight:700;font-size:21px;min-height:70px;padding:16px 25px;display:block;margin:19px auto}.cta:hover:not(:disabled){background:#2c2c2c}.cta.outline{border:2px solid #d6d6d6;background:transparent;color:#555;font-weight:400}.cta.outline:hover:not(:disabled){background:#f0f0f0}.back{text-align:left;margin:20px 0 0}.back button{border:0;background:transparent;color:#888;font-size:15px;padding:5px 18px}.back button:hover{text-decoration:underline}.two-buttons{padding:10px 0 0}.two-buttons .cta{margin:14px auto}.library-section{max-width:1050px;margin:auto}.counts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px auto 24px}.count{border:1px solid #e1e1e1;border-radius:18px;padding:24px 12px;background:transparent}.count strong{display:block;font-size:40px}.count span{display:block;color:#666;font-size:21px;margin-top:8px}.tabletitle{text-align:left;font-weight:700;font-size:23px;margin:28px 0 11px}.scrolltable{border:1px solid #e1e1e1;border-radius:16px;overflow:auto;max-height:375px;text-align:left}table{border-collapse:collapse;width:100%}th,td{padding:16px 18px;border-bottom:1px solid #e7e7e7;font-size:17px}th{position:sticky;top:0;background:#fafafa}td a{color:#2474d4}.field{display:block;width:min(100%,800px);margin:18px auto;border:1px solid #d1d1d1;border-radius:15px;background:white;height:68px;text-align:center;padding:14px;font-size:21px}.connection-copy{font-size:21px;line-height:1.65}.connection-copy strong{display:block;margin-top:10px}.splash{padding:30px 0 70px}.splash .bigcheck{color:#0ca657;font-size:54px;margin:36px 0}.splash h2{font-size:28px}.text-status{font-size:18px;color:#777}.message{font-size:16px;color:#bb2929;text-align:center;max-width:880px;margin:22px auto}.info{color:#777;font-size:17px}.box-note{max-width:840px;margin:22px auto;color:#666;font-size:17px}.verification{max-width:1050px;text-align:left;margin:42px auto}.verification strong{font-size:20px}.verification .row{display:flex;justify-content:space-between;color:#777;font-size:17px;margin:10px 0 34px}.verification .progress-track{height:11px;margin-top:18px}.disabled-note{color:#777;font-size:15px;margin-top:18px}.address{font-size:14px;color:#777;margin:14px auto}.hidden{display:none}@media(max-width:720px){body{padding:8px}#app{border-radius:22px;padding:21px 16px}.view{padding-top:28px}h1{font-size:29px}.lead{font-size:19px}.cta{font-size:17px;min-height:58px}.counts{gap:8px}.count strong{font-size:29px}th,td{padding:9px;font-size:13px}.step{font-size:14px}}
</style></head><body><main id="app"></main><script>
const SESSION='__LOCAL_SESSION_TOKEN__';
const state={step:1,archive:'',tracks:[],artists:[],lidarr:'http://127.0.0.1:8686',key:'',busy:false,error:'',connectionStage:'',verificationStage:'prepare',found:false,hasData:false,verify:null,verifyPolling:false};
const el=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,kind='',disabled=false)=>`<button class="cta ${kind}" ${disabled||state.busy?'disabled':''} onclick="${action}">${label}</button>`;
const back=(n)=>`<div class="back"><button onclick="changeStep(${n})">← Back</button></div>`;
async function api(name,data={}){let r;try{r=await fetch('/api/'+name,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','X-Local-Session':SESSION},body:JSON.stringify(data)})}catch{throw new Error('The .NET service is not responding. Keep the console open.')}let d;try{d=await r.json()}catch{throw Error('The local service returned an unreadable response.')}if(!r.ok)throw Error(d.error||'Request failed');return d}
function changeStep(n){state.step=n;state.error='';state.connectionStage='';render()}
function alertError(e){state.busy=false;state.connectionStage='';state.error=e?.message||String(e);render()}
function table(rows){return `<div class="scrolltable"><table><thead><tr><th>#</th><th>Artist</th><th>Song</th><th>YouTube Link</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.Artist)}</td><td>${esc(r.Song)}</td><td>${/^https:\/\/www\.youtube\.com\/watch\?v=[A-Za-z0-9_-]{11}$/.test(r.YouTubeUrl||'')?`<a href="${esc(r.YouTubeUrl)}" target="_blank" rel="noopener noreferrer">View ↗</a>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}
function render(){let c='';const s=state.step;
if(s===1)c=`<section class="view"><h1 style="margin:18px 0 32px">Choose Your Data</h1><div class="two-buttons">${btn('Choose Google Account','changeStep(2)')}${btn('Downloaded Data File','changeStep(3)','outline')}</div></section>`;
if(s===2)c=`<section class="view compact"><h1>Prepare Your YouTube Music Export</h1><p class="lead">You're about to be directed to Google Takeout to download a copy of your<br>YouTube Music library.</p><p class="lead">On Google's website, click <strong>Next step</strong>, then change the <strong>File size to 50 GB.</strong></p><p class="lead muted">Don't worry! Your music library metadata is likely much smaller than 50 GB. Song<br>titles, artists, and links generally take up just a few megabytes. Uploaded media<br>may make an export larger.</p><p class="lead">Google may take several minutes to several days to prepare your export.</p><p class="lead">You'll receive an email confirming your request and another when your export is<br>ready to download.</p><p class="fine">You can download an already prepared export again while it remains available.</p>${btn('Continue to Google Takeout ↗','openTakeout()')}${back(1)}</section>`;
if(s===3)c=`<section class="view"><div class="symbol">⌕</div><h1>Find Your Downloaded Music Data</h1><p class="lead muted">Once your Google Takeout export is ready, download the ZIP file and scan your<br>Downloads folder.</p>${btn(state.busy?'Scanning...':'⌕ Scan for Takeout File','scan()',state.busy?'outline':'',state.busy)}${state.archive?`<p class="address">Archive: ${esc(state.archive)}</p>`:''}${state.busy?'<p class="info">Analyzing archive...</p>':''}${back(1)}</section>`;
if(s===4){const credits=new Set(state.tracks.map(t=>String(t.Artist||'').trim().toLowerCase()).filter(Boolean)).size;c=`<section class="view compact"><div class="symbol ok">✓</div><h1>Your Music Library Is Ready!</h1><div class="library-section"><h2>YouTube Music Data</h2><div class="counts"><div class="count"><strong>${credits}</strong><span>Artists</span></div><div class="count"><strong>${state.tracks.length}</strong><span>Songs</span></div></div><p class="fine">Counts are from the selected archive. Artist figures are unverified unique credit strings.</p><div class="tabletitle">Music Preview</div>${table(state.tracks.slice(0,100))}${btn('Continue to Lidarr Setup','changeStep(5)')}${back(3)}</div></section>`}
if(s===5){if(state.connectionStage){const done=state.connectionStage==='connected';c=`<section class="view"><div class="symbol">▤</div><h1>Connect to Lidarr</h1><div class="splash"><div class="bigcheck">${done?'✓':'◌'}</div><h2>${done?'Connected to Lidarr!':'Connecting to Lidarr...'}</h2><p class="text-status">${done?'API key validated and Lidarr artist catalog loaded.':'Verifying API key and loading the artist catalog...'}</p></div></section>`}else{c=`<section class="view"><div class="symbol">▤</div><h1>Connect to Lidarr</h1><p class="lead muted" style="margin-bottom:23px">Lidarr ${state.found?'found!':'connection setup'}</p><p class="connection-copy">To find your API key, open Lidarr and use the left sidebar:<strong>Settings → General → API Key</strong></p>${btn('Get API Key ↗','openLidarr()','outline')}<input class="field" id="key" type="password" placeholder="Paste your API key" value="${esc(state.key)}" autocomplete="off" spellcheck="false" oninput="state.key=this.value"/><details class="narrow fine" style="margin:10px auto"><summary>Use a different Lidarr address</summary><input class="field" id="lidarr-url" value="${esc(state.lidarr)}" oninput="state.lidarr=this.value" aria-label="Lidarr address"/></details>${btn('Connect to Lidarr','connect()')}${back(4)}</section>`}}
if(s===6){if(state.verificationStage==='prepare')c=`<section class="view"><div class="symbol">♫</div><h1>Preparing to Verify Your Music Library</h1><p class="lead">This next part can take a few minutes to over an hour, depending on the number of<br>artists and songs in your library.</p><p class="lead muted">We'll clean up your YouTube Music data, compare songs and artists with<br>MusicBrainz, and check the results against your Lidarr library. Each scan starts fresh,<br>without previously saved matching results.</p>${btn('Begin Verification','showVerification()')}${back(5)}</section>` ;else {const v=state.verify||{};const total=v.total||state.tracks.length;const checked=v.checkedCount||0;const totalA=v.totalArtists||new Set(state.tracks.map(x=>x.Artist?.toLowerCase()).filter(Boolean)).size;const resolved=v.resolvedArtists||0;const pct=(x,t)=>t?Math.round(100*x/t):0;c=`<section class="view"><div class="symbol">⌕</div><h1>Verifying Your Music Library</h1><p class="lead muted">Checking exact MusicBrainz recording titles and credited artist IDs.</p><div class="verification"><strong>Recordings Checked</strong><div class="progress-track"><div class="progress-fill" style="width:${pct(checked,total)}%"></div></div><div class="row"><span>${checked} of ${total} checked</span><span>${pct(checked,total)}%</span></div><strong>Unique Artists Resolved</strong><div class="progress-track"><div class="progress-fill" style="width:${pct(resolved,totalA)}%"></div></div><div class="row"><span>${resolved} of ${totalA} identified</span><span>${pct(resolved,totalA)}%</span></div></div><p class="fine narrow">${esc(v.phase||'Starting verification...')}</p><p class="fine narrow">Verified recordings: ${v.verifiedRecordings||0} · Ambiguous: ${v.ambiguous||0} · Not matched: ${v.unmatched||0} · Lookup failures: ${v.lookupFailures||0} · HTTP requests: ${v.requests||0} · Retries: ${v.retries||0}</p>${v.errorDetail?`<p class="message">${esc(v.errorDetail)}</p>`:''}${v.running?'<p class="fine narrow">Each scan starts fresh and does not reuse cached responses. Keep the application open.</p>':''}${!v.running&&v.started?`<div class="audit-report narrow"><h2>Independent confidence audit</h2><p class="fine">Artist confidence and song confidence are calculated separately. A MusicBrainz search result is not a complete artist catalog.</p><p class="fine">High-confidence songs: ${v.songHighConfidence??'—'} · Songs requiring more evidence: ${v.songNeedsReview??'—'}</p><p class="fine">High-confidence artist identities: ${v.artistHighConfidence??'—'} · Artist identities requiring more evidence: ${v.artistNeedsReview??'—'}</p>${btn('Export Song-by-Song Evidence (CSV)','exportAudit(\'songs\')','outline')}${btn('Export Artist & Song Lists (CSV)','exportAudit(\'artists\')','outline')}</div>`:''}${!v.running&&v.started?btn('Run a Fresh Verification Again','showVerification()','outline'):''}</section>`}}

el.innerHTML=`<div class="progress-track"><div class="progress-fill" style="width:${[10,20,35,40,50,56][s-1]||10}%"></div></div><div class="step">STEP ${s} OF 10</div><div class="divider"></div>${c}${state.error?`<p class="message" role="alert">${esc(state.error)}</p>`:''}`;
}
function openTakeout(){window.open('https://takeout.google.com/settings/takeout/custom/youtube','_blank','noopener,noreferrer');changeStep(3)}
function openLidarr(){const u=state.lidarr.trim();if(!/^https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/?$/i.test(u)){alertError(Error('Use your local Lidarr address, such as http://127.0.0.1:8686.'));return}window.open(u.replace(/\/$/,'')+'/settings/general','_blank','noopener,noreferrer')}
async function scan(){state.busy=true;state.error='';render();try{const r=await api('scan');if(!r.found)throw Error(r.message||'Takeout ZIP not found in Downloads.');state.archive=r.archive;render();await api('analyze');await poll()}catch(e){alertError(e)}}
async function poll(){try{let r=await api('state');if(r.analyzing){setTimeout(poll,700);return}if(r.analysisError)throw Error(r.analysisError);state.tracks=r.tracks||[];if(!state.tracks.length)throw Error('No music records were found.');state.busy=false;changeStep(4)}catch(e){alertError(e)}}
async function connect(){if(state.busy)return;state.busy=true;state.error='';state.connectionStage='connecting';render();try{const r=await api('lidarr/connect',{url:state.lidarr.trim(),key:state.key.trim()});state.artists=r.artistRecords||[];state.busy=false;state.key='';state.connectionStage='connected';state.found=true;render();setTimeout(()=>{if(state.step===5&&state.connectionStage==='connected')changeStep(6)},950)}catch(e){alertError(e)}}
async function showVerification(){state.verificationStage='progress';state.verify={phase:'Starting verification...',running:true};render();try{await api('verify/start');if(!state.verifyPolling){state.verifyPolling=true;pollVerification()}}catch(e){state.verify={running:false,phase:e.message};alertError(e)}}
async function pollVerification(){try{const v=await api('verify/status');state.verify=v;if(state.step===6&&state.verificationStage==='progress')render();if(v.running){setTimeout(pollVerification,1100)}else{state.verifyPolling=false}}catch(e){state.verifyPolling=false;state.error=e.message;render()}}
async function exportAudit(kind){try{const r=await fetch('/api/audit/'+kind+'.csv',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','X-Local-Session':SESSION},body:'{}'});if(!r.ok){const e=await r.json();throw Error(e.error||'Export failed')}const blob=await r.blob();const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='musicbrainz-'+kind+'-audit.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){state.error=e.message;render()}}
function prepareVerification(){state.verificationStage='prepare';render()}
render();
</script></body></html>
