<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Music Takeout to Lidarr</title><style>
:root{font-family:Inter,'Segoe UI',system-ui,sans-serif;color:#141414;background:#f9fafb;font-size:16px}*{box-sizing:border-box}body{margin:0;padding:18px}#app{max-width:1240px;margin:0 auto;background:#fafafa;border:1px solid #e2e2e2;border-radius:25px;padding:30px 28px;min-height:680px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button.primary{border:0;background:#0b0b0b;color:white;border-radius:40px;padding:13px 24px;font-weight:650}button.secondary{border:1.5px solid #d5d5d5;background:transparent;border-radius:40px;padding:12px 22px;color:#555}button.ghost{border:0;background:transparent;color:#555;padding:10px 16px}button.primary:hover:not(:disabled){background:#343434}button.secondary:hover:not(:disabled){background:#eee}.wide{width:100%;max-width:565px}.top{display:flex;align-items:center;gap:22px}.stepcount{font-size:14px;color:#666;width:120px;flex-shrink:0}.stepselect{flex:1;border:1.5px solid #d5d5d5;border-radius:30px;background:transparent;padding:12px 17px;min-width:0}.bar{width:100%;height:8px;background:#eee;border-radius:50px;overflow:hidden}.bar>div{height:100%;background:#367fdf;transition:width .2s}.mainbar{margin:18px 0 28px}.rule{border:0;border-top:1px solid #e7e7e7;margin:24px 0}.screen{text-align:center;min-height:450px;padding:12px 0 20px}h1{font-size:30px;font-weight:650;line-height:1.3;margin:22px 0 26px}h2{font-size:21px;font-weight:650;margin:22px 0 15px}h3{font-size:18px;margin:18px 0 12px}.intro{font-size:20px;line-height:1.6;max-width:1090px;margin:0 auto 20px}.sub{color:#666;line-height:1.6}.small{font-size:14px}.centerBtns{display:grid;gap:12px;justify-items:center;margin:20px auto}.centerBtns button{width:100%;max-width:565px}.icon{font-size:30px;color:#777;line-height:1.1;margin:16px 0}.success{color:#06a046}.nav{display:flex;justify-content:space-between;align-items:center}.footer{color:#777;font-size:13px;margin-top:14px}.section{max-width:1100px;margin:0 auto 20px;text-align:left}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:15px 0 24px}.stats{text-align:center;padding:18px 12px;border:1px solid #e5e5e5;border-radius:12px;min-height:93px}.stats .num{font-size:30px;font-weight:600;margin-bottom:8px}.stats .label{color:#555}.clickable{cursor:pointer}.clickable:hover{background:#f0f0f0}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.tableWrap{overflow:auto;max-height:420px;border:1px solid #e4e4e4;border-radius:12px}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:12px;border-bottom:1px solid #eaeaea;font-size:14px}th{position:sticky;top:0;background:#fafafa}td a{color:#226cc8}.input{padding:12px 15px;border:1px solid #cfcfcf;border-radius:12px;width:100%;max-width:565px}.panel{border:1px solid #e1e1e1;border-radius:14px;padding:20px;text-align:left}.option{cursor:pointer;margin:12px 0}.option.active{border-color:#383838;background:#f0f0f0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.art{width:100%;aspect-ratio:1;background:#eee;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#999;overflow:hidden}.art img{height:100%;width:100%;object-fit:cover}.candidate{max-width:440px}.actions{display:grid;gap:10px;max-width:570px;margin:22px auto}label{cursor:pointer}.notice{background:#f0f3f7;border-radius:12px;padding:14px;color:#444;text-align:left}.progressrow{display:flex;justify-content:space-between;color:#777;font-size:14px;margin:7px 0 16px}.pill{display:inline-block;padding:8px 14px;border-radius:30px;background:#eee;margin:4px}.left{text-align:left}.preview-link{color:#226cc8;text-decoration:underline} .status{font-size:14px;color:#777;margin:14px}.danger{color:#b32020}.limit{max-width:650px;margin:0 auto}@media(max-width:700px){body{padding:5px}#app{padding:16px;border-radius:12px}.top{gap:7px}.stepcount{width:63px;font-size:12px}h1{font-size:24px}.intro{font-size:17px}.cols{gap:8px}.panel{padding:10px}.stats{padding:9px}.stats .num{font-size:23px}}
</style></head><body><div id="app"></div><script>
const titles=['Choose Your Data','Prepare Your YouTube Music Export','Find Your Downloaded Music Data','Your Music Library Is Ready!','Connect to Lidarr','Library Comparison Results','How Would You Like to Continue?','Manual Artist & Song Review','Review Songs for Download','Your Music Migration Summary'];
const S={step:0,archive:'',data:null,summary:null,tracks:[],busy:false,error:'',lidarr:'http://127.0.0.1:8686',found:false,connected:false,artists:0,comparison:null,choice:'now',kind:'artists',alt:false,candidate:0,index:0,decisions:{},selected:[],showDetails:'',reviewFilter:'ready',key:'',custom:false};
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(path,payload={})=>{const res=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok||data.error)throw Error(data.error||res.statusText);return data};
const card=(num,label,action='')=>`<div class="stats ${action?'clickable':''}" ${action?`onclick="${action}"`:''}><div class="num">${esc(num)}</div><div class="label">${esc(label)}</div>${action?'<div class="small sub">View details</div>':''}</div>`;
const btn=(name,act,secondary=false,disabled=false)=>`<button class="${secondary?'secondary':'primary'} wide" ${disabled?'disabled':''} onclick="${act}">${name}</button>`;
const progress=(label,num,total,extra='')=>`<div class="section"><strong>${label}</strong><div class="bar" style="margin-top:12px"><div style="width:${total?100*num/total:0}%"></div></div><div class="progressrow"><span>${num} of ${total} ${extra}</span><span>${total?Math.round(100*num/total):0}%</span></div></div>`;
const link=(href,label)=>href&&/^https:\/\//.test(href)?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:'Unavailable';
const uniqueArtists=()=>[...new Set(S.tracks.map(t=>t.Artist).filter(Boolean))];
function jump(step){S.step=step;S.error='';render();if(step===4&&!S.connected)checkLidarr()}
function render(){
let html=`<div class="top"><span class="stepcount">SCREEN ${S.step+1} OF 10</span><select class="stepselect" aria-label="Select screen" onchange="jump(Number(this.value))">${titles.map((t,i)=>`<option value="${i}" ${i===S.step?'selected':''}>${i+1}. ${t}</option>`).join('')}</select></div><div class="bar mainbar"><div style="width:${(S.step+1)*10}%"></div></div><hr class="rule"><main class="screen">`;
if(S.step===0)html+=`<h1>Choose Your Data</h1><div class="centerBtns">${btn('Choose Google Account','jump(1)')}${btn('Downloaded Data File','jump(2)',true)}</div>`;
if(S.step===1)html+=`<h1>Prepare Your YouTube Music Export</h1><p class="intro">You're about to be directed to Google Takeout to download a copy of your YouTube Music library.</p><p class="intro">On Google's website, click <b>Next step</b>, then change the <b>File size</b> to <b>50 GB</b>.</p><p class="intro sub">Don't worry! Your music library metadata is likely much smaller than 50 GB. Song titles, artists, and links generally take up just a few megabytes. Uploaded media may make an export larger.</p><p class="intro">Google may take several minutes to several days to prepare your export.</p><p class="intro">You'll receive an email confirming your request and another when your export is ready to download.</p><p class="intro sub small">You can download an already prepared export again while it remains available.</p><div class="centerBtns">${btn('Continue to Google Takeout ↗','openTakeout()')}</div>`;
if(S.step===2)html+=`<div class="icon">♧</div><h1>Find Your Downloaded Music Data</h1><p class="intro sub">Once your Google Takeout export is ready, download the ZIP file and scan your Downloads folder.</p><div class="centerBtns">${btn(S.busy?'Scanning…':'⌕  Scan for Takeout File','scan()',false,S.busy)}</div>${S.archive?`<p class="status">Archive: ${esc(S.archive)}</p>${S.busy?'<p class="sub">Analyzing archive…</p>':''}`:''}${S.error?`<p class="danger">${esc(S.error)}</p>`:''}`;
if(S.step===3){let sum=S.summary;html+=`<div class="icon success">✓</div><h1>Your Music Library Is Ready!</h1>${sum?`<div class="statgrid">${card(sum.songs,'Music records')}${card(sum.artists,'Unique displayed artists')}${card(sum.links,'YouTube links')}${card(sum.uploadedAudio,'Uploaded audio files')}</div><p class="small sub">${esc(sum.warning||'Counts are from the selected archive.')}</p>`:'<p class="sub">No archive analyzed yet. Please return to the scan screen.</p>'}<div class="section"><h3>Music Preview</h3>${trackTable(S.tracks.slice(0,100))}</div><div class="centerBtns">${btn('Continue to Lidarr Setup','jump(4)',false,!sum)}</div>`}
if(S.step===4)html+=`<div class="icon">▤</div><h1>Connect to Lidarr</h1><p class="intro sub">${S.connected?'Connected to Lidarr.':'The application checks the default Lidarr address automatically.'}</p><div class="limit"><input class="input" id="lidarrURL" value="${esc(S.lidarr)}" placeholder="http://192.168.1.100:8686" aria-label="Lidarr address"><div class="centerBtns">${btn(S.found?'Test Address Again':'Try Lidarr Address','testAddress()',true)}</div>${S.found||S.connected?`<p>To find your API key, open Lidarr and use the left sidebar:</p><p><b>Settings → General → API Key</b></p>${btn('Get API Key ↗','openLidarr()',true)}<div style="margin:17px auto"><input class="input" type="password" id="apiKey" placeholder="Paste your API key" autocomplete="off"></div>${btn('Connect to Lidarr','connectLidarr()')}`:'<p class="sub">If the default address cannot be reached, enter another Lidarr address above.</p>'}${S.error?`<p class="danger">${esc(S.error)}</p>`:''}${S.connected?`<p class="success">Connected! ${S.artists} artists in Lidarr.</p>${btn('Compare with Lidarr','compareLidarr()')}`:''}</div>`;
if(S.step===5){let c=S.comparison;html+=`<h1>Library Comparison Results</h1><div class="section"><h2>YouTube Music Data</h2><h3>Found</h3><div class="statgrid">${card(S.summary?S.summary.artists:'—','Artists',"viewGroup('foundArtists')")}${card(S.summary?S.summary.songs:'—','Songs',"viewGroup('foundSongs')")}</div><h3>Needs Review</h3><div class="statgrid">${card(c?c.requiresVerification:'—','Artists',"viewGroup('reviewArtists')")}${card('Pending','Songs')}</div><h2>YouTube Music vs. Lidarr</h2><h3>Pending to Be Added</h3><div class="statgrid">${card('Pending verification','Artists')}${card('Pending verification','Songs')}</div><h3>Already in Lidarr</h3><div class="statgrid">${card(c?c.namePresent:'—','Artists (name matches)',"viewGroup('existingArtists')")}${card('Pending','Songs')}</div><p class="sub small">${esc(c?.note||'Connect to Lidarr and run comparison for actual results. Name matches are not verified MusicBrainz identities.')}</p>${S.showDetails?`<div class="panel"><h3>${esc(S.showDetails)}</h3>${S.showDetails==='Songs Found'?trackTable(S.tracks.slice(0,100)):S.showDetails==='Artists Found'?`<div class="tableWrap"><table>${uniqueArtists().slice(0,100).map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a)}</td></tr>`).join('')}</table></div>`:'Artist identities require MusicBrainz verification.'}</div>`:''}</div><div class="centerBtns">${btn('Continue','jump(6)',false,!c)}</div>`}
if(S.step===6)html+=`<h1>How Would You Like to Continue?</h1><p class="intro">Some artists and songs may have verified matches. Others will require manual review.</p><div class="section"><div class="panel option ${S.choice==='now'?'active':''}" onclick="S.choice='now';render()"><h3>◉ Add Verified Matches Now</h3><p class="sub">Add approved, independently verified artists in the background while reviewing remaining items.</p></div><div class="panel option ${S.choice==='later'?'active':''}" onclick="S.choice='later';render()"><h3>○ Review Everything First</h3><p class="sub">Hold all changes until the entire review is finished.</p></div></div><p class="sub small">No artist additions or downloads are enabled in this build. Review choices can be explored without changing Lidarr.</p>${btn('Continue to Manual Review','jump(7)')}`;
if(S.step===7){let artists=uniqueArtists();let record=artists[S.index]||'No available artists';let decisions=Object.values(S.decisions);let approved=decisions.filter(x=>x==='matched').length,second=decisions.filter(x=>x==='second').length;html+=`<h1>Compare Artist & Song Matches</h1>${progress('Being Added to Your Lidarr Library',0,0,'added — imports not yet enabled')}${progress('Manual Review Progress',decisions.length,artists.length,'reviewed')}<div class="statgrid">${card(approved,'Artists Matched')}${card(second,'Artists Not Matched / Second Review')}</div><div class="section"><h2>Compare Artist Matches</h2><p class="small sub">Artist ${Math.min(S.index+1,artists.length)} of ${artists.length}</p><div class="cols"><div class="panel"><b>YouTube Music</b><div class="art">♫</div><h3>${esc(record)}</h3><p>${link('https://music.youtube.com/search?q='+encodeURIComponent(record),'Open YouTube Music ↗')}</p></div><div class="panel"><b>MusicBrainz Candidate</b><div class="art">◎</div><h3>Not verified</h3><p class="sub small">A candidate must be verified using MusicBrainz recording evidence. We won't invent one.</p><p>${link('https://musicbrainz.org/search?query='+encodeURIComponent(record)+'&type=artist','Search MusicBrainz ↗')}</p></div></div>${S.alt?`<div class="panel" style="margin-top:16px"><h3>Other Possible Artist Matches</h3><div class="art" style="max-width:160px">◎</div><p class="sub">Live candidate images and verified IDs aren't integrated yet. Use the MusicBrainz search link above.</p></div>`:''}</div><div class="actions">${btn('Not a Match — Show Other Artists','S.alt=!S.alt;render()',true)}${btn('No Correct Match — Second Review',"recordDecision('second')",true,artists.length===0)}${btn('Previous Artist','previousArtist()',true,S.index===0)}${btn('Next Artist','nextArtist()',true,S.index>=artists.length-1)}</div><div class="notice">This build supports reviewing source artists and opening comparison links. Confirm Match is not enabled until individual MusicBrainz candidates are validated. Song matching and licensed audio preview integration are still pending.</div>`}
if(S.step===8){html+=`<h1>Review Songs for Download</h1><p class="intro sub">Select verified missing songs you'd like Lidarr to search for.</p><div class="statgrid three">${card('0','Ready to Search')}${card('—','Already in Lidarr')}${card('—','Needs Review')}</div><div class="section"><div class="centerBtns">${btn('Select All','selectAll()',true,true)}</div><p class="small sub">Only recording- and release-verified missing tracks may be selected. No eligible songs have been verified in this version.</p></div><div class="notice">Starting release searches and downloads is disabled until the matching and confirmation safeguards are implemented. This avoids triggering whole-album downloads unintentionally.</div>`}
if(S.step===9)html+=`<div class="icon success">✓</div><h1>Your Music Migration Summary</h1><p class="intro sub">Completed additions, downloads still processing, and items requiring attention will appear here.</p><div class="statgrid">${card(0,'Artists Added')}${card(0,'Songs Downloaded')}${card('—','Already in Lidarr')}${card(0,'Still Processing')}${card('—','Needs Second Review')}${card(0,'Needs Manual Add')}</div><div class="notice">No Lidarr imports, searches, or downloads have been performed by this version. These are actual operation totals, not sample data.</div><div class="centerBtns">${btn('Return to Start','jump(0)',true)}${S.data?.report?btn('Open Saved Report','openReport()',true):''}</div>`;
html+=`</main><hr class="rule"><div class="nav"><button class="secondary" onclick="jump(Math.max(0,S.step-1))" ${S.step===0?'disabled':''}>← Back</button><button class="secondary" onclick="jump(Math.min(9,S.step+1))" ${S.step===9?'disabled':''}>Next →</button></div><div class="footer">YouTube Music to Lidarr · Local Windows app · No Lidarr imports or downloads without explicit approval.</div>`;
$('app').innerHTML=html;
}
function trackTable(rows){return `<div class="tableWrap"><table><thead><tr><th>#</th><th>Artist</th><th>Song</th><th>YouTube Link</th></tr></thead><tbody>${rows.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.Artist)}</td><td>${esc(t.Song)}</td><td>${link(t.YouTubeUrl,'View ↗')}</td></tr>`).join('')}</tbody></table></div>`}
function openTakeout(){window.open('https://takeout.google.com/settings/takeout/custom/youtube','_blank','noopener');jump(2)}
async function scan(){S.busy=true;S.error='';render();try{const found=await api('scan');if(!found.found){S.error=found.message||'No archive selected';return}S.archive=found.archive;const a=await api('analyze');if(!a.started)throw Error('Analysis did not start');S.busy=true;render();pollAnalysis()}catch(e){S.error=e.message;S.busy=false;render()}}
async function pollAnalysis(){try{let state=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());if(state.analyzing){setTimeout(pollAnalysis,1400);return}S.busy=false;S.data=state;if(state.analysisError)throw Error(state.analysisError);if(!state.summary)throw Error('No analysis results returned');S.summary=state.summary;S.tracks=state.tracks||[];jump(3)}catch(e){S.error=e.message;S.busy=false;render()}}
async function checkLidarr(){try{const result=await api('lidarr/check',{url:S.lidarr});S.found=result.found;S.error=result.found?'': 'Default address not found. Enter your Lidarr address.';render()}catch(e){S.error=e.message;S.found=false;render()}}
async function testAddress(){S.lidarr=$('lidarrURL').value.trim();S.error='Checking address…';render();await checkLidarr()}
function openLidarr(){let url=$('lidarrURL')?.value.trim()||S.lidarr;if(/^https?:\/\//.test(url))window.open(url,'_blank','noopener')}
async function connectLidarr(){let key=$('apiKey')?.value||'';let url=$('lidarrURL')?.value||S.lidarr;try{let d=await api('lidarr/connect',{url,key});S.connected=true;S.found=true;S.artists=d.artists;S.lidarr=url;S.error='';render()}catch(e){S.error=e.message;render()}}
async function compareLidarr(){try{S.comparison=await api('lidarr/compare');jump(5)}catch(e){S.error=e.message;render()}}
function viewGroup(kind){S.showDetails=kind==='foundArtists'?'Artists Found':kind==='foundSongs'?'Songs Found':kind==='reviewArtists'?'Artists Requiring Verification':'Artists in Lidarr (name matches only)';render()}
function recordDecision(kind){S.decisions[S.index]=kind;nextArtist()}
function nextArtist(){S.index=Math.min(uniqueArtists().length-1,S.index+1);S.alt=false;render()}
function previousArtist(){S.index=Math.max(0,S.index-1);S.alt=false;render()}
function selectAll(){};
function openReport(){alert('The report is saved locally at: '+S.data.report+'\\nOpen the folder in Windows File Explorer to view it.')}
render();
</script></body></html>
