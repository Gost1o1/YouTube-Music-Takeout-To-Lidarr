<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Music Takeout to Lidarr</title><style>
:root{font-family:Inter,'Segoe UI',system-ui,sans-serif;color:#141414;background:#f9fafb;font-size:16px}*{box-sizing:border-box}body{margin:0;padding:18px}#app{max-width:1240px;margin:0 auto;background:#fafafa;border:1px solid #e2e2e2;border-radius:25px;padding:18px 24px;min-height:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button.primary{border:0;background:#0b0b0b;color:white;border-radius:40px;padding:13px 24px;font-weight:650}button.secondary{border:1.5px solid #d5d5d5;background:transparent;border-radius:40px;padding:12px 22px;color:#555}button.ghost{border:0;background:transparent;color:#555;padding:10px 16px}button.primary:hover:not(:disabled){background:#343434}button.secondary:hover:not(:disabled){background:#eee}.wide{width:100%;max-width:565px}.top{display:flex;align-items:center;gap:22px}.stepcount{font-size:14px;color:#666;width:120px;flex-shrink:0}.steptitle{flex:1;font-weight:500;border:1.5px solid #d5d5d5;border-radius:30px;padding:12px 17px;min-width:0}.stepselect{flex:1;border:1.5px solid #d5d5d5;border-radius:30px;background:transparent;padding:12px 17px;min-width:0}.bar{width:100%;height:8px;background:#eee;border-radius:50px;overflow:hidden}.bar>div{height:100%;background:#367fdf;transition:width .2s}.mainbar{margin:5px 0 6px}.stepProgress{text-align:right;color:#777;font-size:13px;margin-bottom:19px}.rule{border:0;border-top:1px solid #e7e7e7;margin:12px 0}.screen{text-align:center;padding:8px 0 0}h1{font-size:30px;font-weight:650;line-height:1.3;margin:22px 0 26px}h2{font-size:21px;font-weight:650;margin:22px 0 15px}h3{font-size:18px;margin:18px 0 12px}.intro{font-size:20px;line-height:1.6;max-width:1090px;margin:0 auto 20px}.sub{color:#666;line-height:1.6}.small{font-size:14px}.centerBtns{display:grid;gap:12px;justify-items:center;margin:20px auto}.centerBtns button{width:100%;max-width:565px}.icon{font-size:30px;color:#777;line-height:1.1;margin:16px 0}.success{color:#06a046}.nav{display:flex;justify-content:space-between;align-items:center}.footer{color:#777;font-size:13px;margin-top:14px}.section{max-width:1100px;margin:0 auto 20px;text-align:left}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:15px 0 24px}.stats{text-align:center;padding:18px 12px;border:1px solid #e5e5e5;border-radius:12px;min-height:93px}.stats .num{font-size:30px;font-weight:600;margin-bottom:8px}.stats .label{color:#555}.clickable{cursor:pointer}.clickable:hover{background:#f0f0f0}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.tableWrap{overflow:auto;max-height:min(39vh,360px);border:1px solid #e4e4e4;border-radius:12px}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:12px;border-bottom:1px solid #eaeaea;font-size:14px}th{position:sticky;top:0;background:#fafafa}td a{color:#226cc8}.input{padding:12px 15px;border:1px solid #cfcfcf;border-radius:12px;width:100%;max-width:565px}.panel{border:1px solid #e1e1e1;border-radius:14px;padding:20px;text-align:left}.option{cursor:pointer;margin:12px 0}.option.active{border-color:#383838;background:#f0f0f0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.art{width:100%;aspect-ratio:1;background:#eee;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#999;overflow:hidden}.art img{height:100%;width:100%;object-fit:cover}.candidate{max-width:440px}.actions{display:grid;gap:10px;max-width:570px;margin:22px auto}label{cursor:pointer}.notice{background:#f0f3f7;border-radius:12px;padding:14px;color:#444;text-align:left}.progressrow{display:flex;justify-content:space-between;color:#777;font-size:14px;margin:7px 0 16px}.pill{display:inline-block;padding:8px 14px;border-radius:30px;background:#eee;margin:4px}.left{text-align:left}.preview-link{color:#226cc8;text-decoration:underline} .status{font-size:14px;color:#777;margin:14px}.danger{color:#b32020}.limit{max-width:650px;margin:0 auto}@media(max-width:700px){body{padding:5px}#app{padding:16px;border-radius:12px}.top{gap:7px}.stepcount{width:63px;font-size:12px}h1{font-size:24px}.intro{font-size:17px}.cols{gap:8px}.panel{padding:10px}.stats{padding:9px}.stats .num{font-size:23px}}
.api-key-input{text-align:center!important;direction:ltr;-webkit-text-security:disc}.api-key-input::placeholder{text-align:center}.option{text-align:center}.option h3,.option p{text-align:center}.quietBack{text-align:left;margin-top:8px}.quietBack button{font-size:12px;color:#888}.connectedSplash{padding:36px 0}.section h2{margin:14px 0 8px}.section h3{margin:12px 0 8px}.section .statgrid{margin:8px 0 14px}.section .stats{min-height:80px;padding:12px}.section .stats .num{font-size:25px}.screen>h2{margin:10px 0}.screen>h1{margin:12px 0 18px} </style></head><body><div id="app"></div><script>
const titles=['Choose Your Data','Prepare Your YouTube Music Export','Find Your Downloaded Music Data','Your Music Library Is Ready!','Connect to Lidarr','Library Comparison Results','How Would You Like to Continue?','Manual Artist & Song Review','Review Songs for Download','Your Music Migration Summary'];
const S={step:0,archive:'',data:null,summary:null,tracks:[],busy:false,error:'',lidarr:'http://127.0.0.1:8686',found:false,connected:false,checking:false,artists:0,comparison:null,verification:null,verificationRunning:false,verificationError:'',connectionPhase:'',preVerifyNotice:false,choice:'now',kind:'artists',alt:false,candidate:0,index:0,decisions:{},selected:[],showDetails:'',reviewFilter:'ready',key:'',custom:false};
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(path,payload={})=>{let res;try{res=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});}catch(e){throw Error('The local Windows service is not responding. Keep the PowerShell window open, then close and relaunch the app with Start.ps1. If this continues, check the startup-errors.log file in Documents\\MusicTakeoutToolkit.');}let data;try{data=await res.json()}catch(e){throw Error('The local service returned an invalid response (HTTP '+res.status+'). Check the PowerShell window for details.')}if(!res.ok||data.error)throw Error(data.error||res.statusText);return data};
const card=(num,label,action='')=>`<div class="stats ${action?'clickable':''}" ${action?`onclick="${action}"`:''}><div class="num">${esc(num)}</div><div class="label">${esc(label)}</div>${action?'<div class="small sub">View details</div>':''}</div>`;
const btn=(name,act,secondary=false,disabled=false)=>`<button class="${secondary?'secondary':'primary'} wide" ${disabled?'disabled':''} onclick="${act}">${name}</button>`;
const progress=(label,num,total,extra='')=>`<div class="section"><strong>${label}</strong><div class="bar" style="margin-top:12px"><div style="width:${total?100*num/total:0}%"></div></div><div class="progressrow"><span>${num} of ${total} ${extra}</span><span>${total?Math.round(100*num/total):0}%</span></div></div>`;
const link=(href,label)=>href&&/^https:\/\//.test(href)?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:'Unavailable';
const uniqueArtists=()=>[...new Set(S.tracks.map(t=>t.Artist).filter(Boolean))];
const artistsNeedingReview=()=>{const known=new Set((S.artists||[]).map(a=>String(a.artistName||'').toLocaleLowerCase().replace(/[^\p{L}\p{N}]/gu,'')));return uniqueArtists().filter(a=>!known.has(a.toLocaleLowerCase().replace(/[^\p{L}\p{N}]/gu,'')))};
function jump(step){S.step=step;S.error='';render();if(step===4&&!S.connected)checkLidarr()}
function render(){
let html=`<div class="bar mainbar"><div style="width:${(S.step+1)*10}%"></div></div><div class="stepProgress">STEP ${S.step+1} OF 10</div><hr class="rule"><main class="screen">`;
if(S.step===0)html+=`<h1>Choose Your Data</h1><div class="centerBtns">${btn('Choose Google Account','jump(1)')}${btn('Downloaded Data File','jump(2)',true)}</div>`;
if(S.step===1)html+=`<h1>Prepare Your YouTube Music Export</h1><p class="intro">You're about to be directed to Google Takeout to download a copy of your YouTube Music library.</p><p class="intro">On Google's website, click <b>Next step</b>, then change the <b>File size</b> to <b>50 GB</b>.</p><p class="intro sub">Don't worry! Your music library metadata is likely much smaller than 50 GB. Song titles, artists, and links generally take up just a few megabytes. Uploaded media may make an export larger.</p><p class="intro">Google may take several minutes to several days to prepare your export.</p><p class="intro">You'll receive an email confirming your request and another when your export is ready to download.</p><p class="intro sub small">You can download an already prepared export again while it remains available.</p><div class="centerBtns">${btn('Continue to Google Takeout ↗','openTakeout()')}</div>`;
if(S.step===2)html+=`<div class="icon">⌕</div><h1>Find Your Downloaded Music Data</h1><p class="intro sub">Once your Google Takeout export is ready, download the ZIP file and scan your Downloads folder.</p><div class="centerBtns">${btn(S.busy?'Scanning…':'⌕  Scan for Takeout File','scan()',false,S.busy)}</div>${S.archive?`<p class="status">Archive: ${esc(S.archive)}</p>${S.busy?'<p class="sub">Analyzing archive…</p>':''}`:''}${S.error?`<p class="danger">${esc(S.error)}</p>`:''}`;
if(S.step===3){let sum=S.summary;html+=`<div class="icon success">✓</div><h1>Your Music Library Is Ready!</h1><h2>YouTube Music Data</h2>${sum?`<div class="statgrid">${card(sum.artists,'Artists')}${card(sum.songs,'Songs')}</div><p class="small sub">${esc(sum.warning||'Counts are from the selected archive.')}</p>`:'<p class="sub">No archive analyzed yet. Please return to the scan screen.</p>'}<div class="section"><h3>Music Preview</h3>${trackTable(S.tracks.slice(0,2000))}</div><div class="centerBtns">${btn('Continue to Lidarr Setup','jump(4)',false,!sum)}</div>`}
if(S.step===4)html+=`<div class="icon">▤</div><h1>Connect to Lidarr</h1>${S.connected?`<div class="connectedSplash"><div class="icon success">✓</div><h2>${S.connectionPhase==='connecting'?'Connecting to Lidarr…':'Connected to Lidarr!'}</h2><p class="sub small">${S.connectionPhase==='connecting'?'Verifying API key and loading the artist catalog…':'Connection verified. Preparing music comparison…'}</p></div>`:`${S.checking?'<p class="intro sub">Checking the default Lidarr address…</p>':S.found?'<p class="intro sub">Lidarr found!</p>':'<p class="intro sub">Lidarr was not found at the default address. Enter the address you use to access Lidarr.</p>'}<div class="limit">${(!S.found && !S.checking)?`<input class="input" id="lidarrURL" value="${esc(S.lidarr)}" placeholder="http://192.168.1.100:8686" aria-label="Lidarr address"><div class="centerBtns">${btn('Test Lidarr Address','testAddress()',true)}</div>`:''}${S.found?`<p>To find your API key, open Lidarr and use the left sidebar:</p><p><b>Settings → General → API Key</b></p>${btn('Get API Key ↗','openLidarr()',true)}<div style="margin:17px auto"><input class="input api-key-input" type="text" id="apiKey" placeholder="Paste your API key" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true"></div>${btn('Connect to Lidarr','connectLidarr()')}`:''}${S.error&&!S.checking?`<p class="danger">${esc(S.error)}</p>`:''}</div>`}`;

if(S.step===5 && S.preVerifyNotice){html+=`<div class="icon">♫</div><h1>Preparing to Verify Your Music Library</h1><p class="intro">This next part can take a few minutes to over an hour, depending on the number of artists and songs in your library.</p><p class="intro sub">We'll clean up your YouTube Music data, compare songs and artists with MusicBrainz, and check the results against your Lidarr library. Completed checks are saved so you can resume if interrupted.</p><div class="centerBtns">${btn('Begin Verification','confirmVerification()')}</div>`;}
if(S.step===5 && S.verificationRunning && !S.preVerifyNotice){let v=S.verification?.status;html+=`<div class="icon">⌕</div><h1>Verifying Your Music Library</h1><p class="intro sub">Checking exact MusicBrainz recording titles and credited artist IDs.</p>${progress('Recordings Checked',v?.processed||0,v?.total||S.summary?.songs||0,'checked')}${progress('Unique Artists Resolved',v?.artistProcessed||0,v?.artistsTotal||S.summary?.artists||0,'identified')}<p class="sub small">${v?.lookupFailures||0} temporary lookup failures · This may take tens of minutes for large libraries. Please keep the application open.</p></div>`;}
if(S.step===5 && !S.verificationRunning && !S.preVerifyNotice){
let c=S.comparison,totalArtists=S.summary?.artists??0,totalSongs=S.summary?.songs??0;
let v=S.verification?.status;html+=`<h1>Library Comparison Results</h1><div class="section"><h2>YouTube Music Data</h2><h3>Found</h3><div class="statgrid">${card(totalArtists,'Artists',"viewGroup('foundArtists')")}${card(totalSongs,'Songs',"viewGroup('foundSongs')")}</div>
<h2>YouTube Music vs. Lidarr</h2><h3>Pending to Be Added to Lidarr</h3><div class="statgrid">${card(v?.done?v.artistVerifiedMissing:'Not finished','Artists · verified for addition')}${card('0','Songs · releases verified for search')}</div>
<h3>Already in Lidarr</h3><div class="statgrid">${card(v?.done?v.artistExisting:(c?c.namePresent:'—'),'Artists · confirmed MusicBrainz IDs in Lidarr',c?"viewGroup('existingArtists')":'')}${card(c?c.songFileCandidates:'—','Songs · title + file candidates (provisional)')}</div>
<h3>Needs Review</h3><div class="statgrid">${card(v?.done?v.artistReview:'Still checking','Artists · unresolved after automatic checks',c?"viewGroup('reviewArtists')":'')}${card(v?.done?v.songReview:'Still checking','Songs · unresolved after automatic checks',c?"viewGroup('reviewSongs')":'')}</div>
${S.verificationError?`<p class="danger">${esc(S.verificationError)}</p>${btn('Retry Verification','startVerification()',true)}`:''}<p class="sub small">${esc(v?.done?'MusicBrainz recording checks completed. Artist IDs are corroborated by credited source recordings. Song searches remain disabled until exact release and file checks are implemented.':c?.note||'Complete the read-only comparison to see your results.')}</p>
${S.showDetails?`<div class="panel"><h3>${esc(S.showDetails)}</h3>${S.showDetails==='Songs Found'||S.showDetails==='Songs Requiring Verification'?trackTable(S.tracks.slice(0,2000)):S.showDetails==='Artists Found'||S.showDetails==='Artists Requiring Verification'?`<div class="tableWrap"><table>${(S.showDetails==='Artists Requiring Verification'?artistsNeedingReview():uniqueArtists()).map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a)}</td></tr>`).join('')}</table></div>`:'Artist matches are based on names; MusicBrainz verification is still required.'}</div>`:''}</div>
<div class="centerBtns">${btn('Continue','jump(6)',false,!c||!v?.done)}</div>`;
}
if(S.step===6)html+=`<h1>How Would You Like to Continue?</h1><p class="intro">The comparison is complete. Choose whether to add independently verified matches when available, or review everything first.</p><div class="section"><div class="panel option ${S.choice==='now'?'active':''}" onclick="S.choice='now';render()"><h3>Add Verified Matches Now</h3><p class="sub">Add approved, independently verified artists in the background while reviewing remaining items.</p></div><div class="panel option ${S.choice==='later'?'active':''}" onclick="S.choice='later';render()"><h3>Review Everything First</h3><p class="sub">Hold all changes until the entire review is finished.</p></div></div><p class="sub small">No artist additions or downloads are enabled in this build. Review choices can be explored without changing Lidarr.</p>${btn('Continue to Manual Review','jump(7)')}`;
if(S.step===7){let artists=uniqueArtists();let record=artists[S.index]||'No available artists';let decisions=Object.values(S.decisions);let approved=decisions.filter(x=>x==='matched').length,second=decisions.filter(x=>x==='second').length;html+=`<h1>Compare Artist & Song Matches</h1>${progress('Being Added to Your Lidarr Library',0,0,'added — imports not yet enabled')}${progress('Manual Review Progress',decisions.length,artists.length,'reviewed')}<div class="statgrid">${card(approved,'Artists Matched')}${card(second,'Artists Not Matched / Second Review')}</div><div class="section"><h2>Compare Artist Matches</h2><p class="small sub">Artist ${Math.min(S.index+1,artists.length)} of ${artists.length}</p><div class="cols"><div class="panel"><b>YouTube Music</b><div class="art">♫</div><h3>${esc(record)}</h3><p>${link('https://music.youtube.com/search?q='+encodeURIComponent(record),'Open YouTube Music ↗')}</p></div><div class="panel"><b>MusicBrainz Candidate</b><div class="art">◎</div><h3>Not verified</h3><p class="sub small">A candidate must be verified using MusicBrainz recording evidence. We won't invent one.</p><p>${link('https://musicbrainz.org/search?query='+encodeURIComponent(record)+'&type=artist','Search MusicBrainz ↗')}</p></div></div>${S.alt?`<div class="panel" style="margin-top:16px"><h3>Other Possible Artist Matches</h3><div class="art" style="max-width:160px">◎</div><p class="sub">Live candidate images and verified IDs aren't integrated yet. Use the MusicBrainz search link above.</p></div>`:''}</div><div class="actions">${btn('Not a Match — Show Other Artists','S.alt=!S.alt;render()',true)}${btn('No Correct Match — Second Review',"recordDecision('second')",true,artists.length===0)}${btn('Previous Artist','previousArtist()',true,S.index===0)}${btn('Next Artist','nextArtist()',true,S.index>=artists.length-1)}</div><div class="notice">This build supports reviewing source artists and opening comparison links. Confirm Match is not enabled until individual MusicBrainz candidates are validated. Song matching and licensed audio preview integration are still pending.</div>`}
if(S.step===8){html+=`<h1>Review Songs for Download</h1><p class="intro sub">Select verified missing songs you'd like Lidarr to search for.</p><div class="statgrid three">${card('0','Ready to Search')}${card('—','Already in Lidarr')}${card('—','Needs Review')}</div><div class="section"><div class="centerBtns">${btn('Select All','selectAll()',true,true)}</div><p class="small sub">Only recording- and release-verified missing tracks may be selected. No eligible songs have been verified in this version.</p></div><div class="notice">Starting release searches and downloads is disabled until the matching and confirmation safeguards are implemented. This avoids triggering whole-album downloads unintentionally.</div>`}
if(S.step===9)html+=`<div class="icon success">✓</div><h1>Your Music Migration Summary</h1><p class="intro sub">Completed additions, downloads still processing, and items requiring attention will appear here.</p><div class="statgrid">${card(0,'Artists Added')}${card(0,'Songs Downloaded')}${card('—','Already in Lidarr')}${card(0,'Still Processing')}${card('—','Needs Second Review')}${card(0,'Needs Manual Add')}</div><div class="notice">No Lidarr imports, searches, or downloads have been performed by this version. These are actual operation totals, not sample data.</div><div class="centerBtns">${btn('Return to Start','jump(0)',true)}${S.data?.report?btn('Open Saved Report','openReport()',true):''}</div>`;
if(S.step>0 && S.step!==4 && S.step!==5 && S.step!==9)html+=`<div class="quietBack"><button class="ghost" onclick="jump(${S.step-1})">← Back</button></div>`;html+=`</main>`;
$('app').innerHTML=html;
}
function trackTable(rows){return `<div class="tableWrap"><table><thead><tr><th>#</th><th>Artist</th><th>Song</th><th>YouTube Link</th></tr></thead><tbody>${rows.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.Artist)}</td><td>${esc(t.Song)}</td><td>${link(t.YouTubeUrl,'View ↗')}</td></tr>`).join('')}</tbody></table></div>`}
function openTakeout(){window.open('https://takeout.google.com/settings/takeout/custom/youtube','_blank','noopener');jump(2)}
async function scan(){S.busy=true;S.error='';render();try{const found=await api('scan');if(!found.found){S.error=found.message||'No archive selected';S.busy=false;render();return}S.archive=found.archive;const a=await api('analyze');if(!a.started)throw Error('Analysis did not start');S.busy=true;render();pollAnalysis()}catch(e){S.error=e.message;S.busy=false;render()}}
async function pollAnalysis(){try{let state=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());if(state.analyzing){setTimeout(pollAnalysis,1400);return}S.busy=false;S.data=state;if(state.analysisError)throw Error(state.analysisError);if(!state.summary)throw Error('No analysis results returned');S.summary=state.summary;S.tracks=state.tracks||[];jump(3)}catch(e){S.error=e.message;S.busy=false;render()}}
async function checkLidarr(){S.checking=true;render();try{const result=await api('lidarr/check',{url:S.lidarr});S.found=result.found;S.error=result.found?'':'Default address not found.'}catch(e){S.error=e.message;S.found=false}finally{S.checking=false;render()}}
async function testAddress(){S.lidarr=$('lidarrURL').value.trim();S.error='';await checkLidarr()}
function openLidarr(){let url=$('lidarrURL')?.value.trim()||S.lidarr;if(/^https?:\/\//.test(url))window.open(url,'_blank','noopener')}
async function connectLidarr(){
 let key=$('apiKey')?.value||'';let url=$('lidarrURL')?.value||S.lidarr;
 S.connected=true;S.connectionPhase='connecting';S.error='';render();
 try{
  let d=await api('lidarr/connect',{url,key});S.found=true;S.artists=d.artistRecords||[];S.lidarr=url;
  S.connectionPhase='connected';render();
  await new Promise(resolve=>setTimeout(resolve,1300));
  S.comparison=await api('lidarr/compare');S.preVerifyNotice=true;S.verificationRunning=false;jump(5);
 }catch(e){S.connected=false;S.connectionPhase='';S.error=e.message;render()}
}
function confirmVerification(){S.preVerifyNotice=false;startVerification()}

async function startVerification(){
 S.preVerifyNotice=false;S.verificationRunning=true;S.verificationError='';jump(5);
 try{await api('verify/start');pollVerification()}catch(e){S.verificationRunning=false;S.verificationError=e.message;S.error=e.message;render()}
}
async function pollVerification(){
 try{let v=await api('verify/status');S.verification=v;S.verificationRunning=!!v.running;
  if(v.status?.done){S.verificationRunning=false;render();return}
  if(!v.running){S.verificationRunning=false;S.verificationError='Verification paused or interrupted. Use Retry Verification to resume completed checks. '+(v.errorDetail||'')+' '+(v.exitCode!==null?'Exit code: '+v.exitCode:'');S.error=S.verificationError;render();return}
  render();setTimeout(pollVerification,1700)
 }catch(e){S.verificationRunning=false;S.error=e.message;render()}
}
async function compareLidarr(){try{S.comparison=await api('lidarr/compare');S.checking=false;await startVerification()}catch(e){S.error=e.message;render()}}
function viewGroup(kind){S.showDetails=kind==='foundArtists'?'Artists Found':kind==='foundSongs'?'Songs Found':kind==='reviewArtists'?'Artists Requiring Verification':kind==='reviewSongs'?'Songs Requiring Verification':'Artists in Lidarr (name matches only)';render()}
function recordDecision(kind){S.decisions[S.index]=kind;nextArtist()}
function nextArtist(){S.index=Math.min(uniqueArtists().length-1,S.index+1);S.alt=false;render()}
function previousArtist(){S.index=Math.max(0,S.index-1);S.alt=false;render()}
function selectAll(){};
function openReport(){alert('The report is saved locally at: '+S.data.report+'\\nOpen the folder in Windows File Explorer to view it.')}
render();
// Keep the local backend alive only while this app window exists.
setInterval(()=>{fetch('/api/heartbeat',{method:'POST',cache:'no-store',keepalive:true}).catch(()=>{});},3000);
fetch('/api/heartbeat',{method:'POST',cache:'no-store'}).catch(()=>{});
window.addEventListener('pagehide',()=>{try{navigator.sendBeacon('/api/shutdown',new Blob(['{}'],{type:'application/json'}))}catch(e){}});
</script></body></html>
